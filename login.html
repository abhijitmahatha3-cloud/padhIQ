<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Terminal — Project AAA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan:    #00f0ff;
    --orange:  #ff6b35;
    --green:   #00ff88;
    --navy:    #020617;
    --navy2:   #0a1628;
    --border:  rgba(255,255,255,0.08);
    --text:    #e2e8f0;
    --muted:   #64748b;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--navy);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── BACKGROUND ── */
  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .nebula {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 70% 60% at 10% 20%, rgba(0,240,255,0.09), transparent),
      radial-gradient(ellipse 50% 50% at 90% 80%, rgba(0,255,136,0.07), transparent),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(255,107,53,0.04), transparent);
    animation: nebulaDrift 18s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes nebulaDrift {
    from { transform: scale(1) rotate(0deg); }
    to   { transform: scale(1.06) rotate(1.5deg); }
  }
  .grid-overlay {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(0,240,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* ── SCAN LINE ── */
  .scanline {
    position: fixed;
    top: -100%;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,240,255,0.4), transparent);
    animation: scanDown 6s linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  @keyframes scanDown {
    from { top: -2%; }
    to   { top: 102%; }
  }

  /* ── MAIN CARD ── */
  .terminal {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 460px;
    margin: 1rem;
    background: rgba(10,22,40,0.85);
    backdrop-filter: blur(30px);
    border: 1px solid rgba(0,240,255,0.2);
    border-radius: 24px;
    box-shadow:
      0 0 0 1px rgba(0,240,255,0.05),
      0 0 60px rgba(0,240,255,0.08),
      0 40px 100px rgba(0,0,0,0.6);
    animation: cardReveal 0.8s cubic-bezier(0.16,1,0.3,1) both;
    overflow: hidden;
  }
  @keyframes cardReveal {
    from { opacity:0; transform: translateY(30px) scale(0.96); }
    to   { opacity:1; transform: translateY(0) scale(1); }
  }

  /* corner accents */
  .terminal::before, .terminal::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: var(--cyan);
    border-style: solid;
    opacity: 0.5;
    z-index: 2;
  }
  .terminal::before { top: 12px; left: 12px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .terminal::after  { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

  /* ── HEADER ── */
  .term-header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: rgba(0,240,255,0.02);
    text-align: center;
  }

  .term-logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--cyan);
    letter-spacing: 6px;
    text-shadow: 0 0 25px var(--cyan), 0 0 50px rgba(0,240,255,0.3);
    margin-bottom: 0.4rem;
  }

  .term-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── MODE TOGGLE ── */
  .mode-toggle {
    display: flex;
    margin: 1.5rem 2.5rem 0;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
  }

  .mode-btn {
    flex: 1;
    padding: 0.55rem;
    border: none;
    border-radius: 9px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.25s;
    background: transparent;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .mode-btn.active {
    background: rgba(0,240,255,0.12);
    color: var(--cyan);
    box-shadow: 0 0 15px rgba(0,240,255,0.1);
  }

  /* ── FORM BODY ── */
  .term-body {
    padding: 1.75rem 2.5rem 2.5rem;
  }

  .field-group {
    margin-bottom: 1.1rem;
    animation: fadeUp 0.5s ease both;
  }
  .field-group:nth-child(1) { animation-delay: 0.1s; }
  .field-group:nth-child(2) { animation-delay: 0.2s; }
  .field-group:nth-child(3) { animation-delay: 0.3s; }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(12px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .field-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    display: block;
    margin-bottom: 0.45rem;
  }

  .field-wrap {
    position: relative;
  }

  .field-icon {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
    opacity: 0.5;
    pointer-events: none;
  }

  .field-input {
    width: 100%;
    padding: 0.8rem 1rem 0.8rem 2.75rem;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 11px;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88rem;
    outline: none;
    transition: all 0.25s;
  }

  .field-input:focus {
    border-color: rgba(0,240,255,0.4);
    background: rgba(0,240,255,0.04);
    box-shadow: 0 0 20px rgba(0,240,255,0.08), inset 0 0 12px rgba(0,240,255,0.03);
  }

  .field-input::placeholder { color: rgba(100,116,139,0.6); }

  /* password toggle */
  .pw-toggle {
    position: absolute;
    right: 0.9rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.4;
    transition: opacity 0.2s;
    color: var(--text);
  }
  .pw-toggle:hover { opacity: 0.8; }

  /* ── SUBMIT BTN ── */
  .submit-btn {
    width: 100%;
    padding: 0.9rem;
    margin-top: 1.5rem;
    background: var(--cyan);
    color: var(--navy);
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 0 30px rgba(0,240,255,0.25);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s 0.4s ease both;
  }

  .submit-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 50px rgba(0,240,255,0.45);
  }
  .submit-btn:hover::after { transform: translateX(100%); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin: 1.5rem 0;
    animation: fadeUp 0.5s 0.5s ease both;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .divider span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  /* ── BACK LINK ── */
  .back-link {
    display: block;
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
    animation: fadeUp 0.5s 0.6s ease both;
  }
  .back-link:hover { color: var(--cyan); }

  /* ── ALERT ── */
  .alert {
    display: none;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    margin-bottom: 1rem;
    animation: fadeUp 0.3s ease both;
  }
  .alert.error   { background: rgba(255,100,100,0.1); border: 1px solid rgba(255,100,100,0.3); color: #ff8080; }
  .alert.success { background: rgba(0,255,136,0.08);  border: 1px solid rgba(0,255,136,0.25);  color: var(--green); }
  .alert.show { display: block; }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 2.5rem;
    border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.2);
  }
  .status-dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ── PARTICLES ── */
  .particle {
    position: fixed;
    width: 2px; height: 2px;
    background: var(--cyan);
    border-radius: 50%;
    pointer-events: none;
    animation: particleFloat linear infinite;
    opacity: 0;
    z-index: 1;
  }
  @keyframes particleFloat {
    0%   { opacity:0; transform: translateY(100vh); }
    10%  { opacity:0.6; }
    90%  { opacity:0.2; }
    100% { opacity:0; transform: translateY(-10vh); }
  }
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="stars" id="stars"></div>
<div class="nebula"></div>
<div class="grid-overlay"></div>
<div class="scanline"></div>

<!-- TERMINAL CARD -->
<div class="terminal">

  <!-- HEADER -->
  <div class="term-header">
    <div class="term-logo">AAA</div>
    <div class="term-label">Access Terminal · Secure Auth</div>
  </div>

  <!-- MODE TOGGLE -->
  <div class="mode-toggle">
    <button class="mode-btn active" id="loginTab" onclick="switchMode('login')">⚡ Login</button>
    <button class="mode-btn" id="signupTab" onclick="switchMode('signup')">✦ Create Account</button>
  </div>

  <!-- BODY -->
  <div class="term-body">

    <div class="alert" id="alertBox"></div>

    <!-- EMAIL -->
    <div class="field-group">
      <label class="field-label" for="email">// Email Address</label>
      <div class="field-wrap">
        <span class="field-icon">@</span>
        <input type="email" id="email" class="field-input" placeholder="student@example.com" autocomplete="email">
      </div>
    </div>

    <!-- PASSWORD -->
    <div class="field-group">
      <label class="field-label" for="password">// Password</label>
      <div class="field-wrap">
        <span class="field-icon">🔒</span>
        <input type="password" id="password" class="field-input" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') handleSubmit()">
        <button class="pw-toggle" onclick="togglePw()" type="button" id="pwToggle">👁</button>
      </div>
    </div>

    <!-- CONFIRM PASSWORD (signup only) -->
    <div class="field-group" id="confirmGroup" style="display:none">
      <label class="field-label" for="confirmPw">// Confirm Password</label>
      <div class="field-wrap">
        <span class="field-icon">🔒</span>
        <input type="password" id="confirmPw" class="field-input" placeholder="••••••••" onkeydown="if(event.key==='Enter') handleSubmit()">
      </div>
    </div>

    <!-- SUBMIT -->
    <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">
      <span id="submitText">INITIATE LOGIN →</span>
    </button>

    <div class="divider"><span>OR CONTINUE AS</span></div>

    <a href="index.html" class="back-link">↩ Browse as guest · No account needed</a>

  </div>

  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-dot"></div>
    <div class="status-text">SECURE CONNECTION · AES-256 · SUPABASE AUTH</div>
  </div>

</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>

let currentMode = 'login';

// ── BUILD STARS ──────────────────────────────────────────
const starContainer = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  const size = Math.random() * 2 + 0.5;
  s.style.cssText = `
    position:absolute;
    width:${size}px; height:${size}px;
    background:#fff;
    border-radius:50%;
    top:${Math.random()*100}%;
    left:${Math.random()*100}%;
    opacity:${Math.random()*0.7+0.1};
    animation: twinkle ${2+Math.random()*4}s ${Math.random()*4}s ease-in-out infinite alternate;
  `;
  starContainer.appendChild(s);
}

const styleEl = document.createElement('style');
styleEl.textContent = `@keyframes twinkle { from{opacity:0.1} to{opacity:0.8} }`;
document.head.appendChild(styleEl);

// ── FLOATING PARTICLES ───────────────────────────────────
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.cssText = `
    left:${Math.random()*100}%;
    width:${Math.random()*2+1}px;
    height:${Math.random()*2+1}px;
    animation-duration:${8+Math.random()*12}s;
    animation-delay:${Math.random()*10}s;
  `;
  document.body.appendChild(p);
}

// ── MODE SWITCH ──────────────────────────────────────────
function switchMode(mode) {
  currentMode = mode;
  const isSignup = mode === 'signup';

  document.getElementById('loginTab').classList.toggle('active', !isSignup);
  document.getElementById('signupTab').classList.toggle('active', isSignup);
  document.getElementById('confirmGroup').style.display = isSignup ? 'block' : 'none';
  document.getElementById('submitText').textContent = isSignup ? 'CREATE ACCOUNT →' : 'INITIATE LOGIN →';
  clearAlert();

  // Re-animate fields
  document.querySelectorAll('.field-group').forEach((el, i) => {
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = `fadeUp 0.4s ${i * 0.08}s ease both`;
  });
}

// ── SUBMIT ───────────────────────────────────────────────
async function handleSubmit() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('submitBtn');

  if (!email || !password) { showAlert('Please fill in all fields.', 'error'); return; }

  if (currentMode === 'signup') {
    const confirm = document.getElementById('confirmPw').value;
    if (password !== confirm) { showAlert('Passwords do not match.', 'error'); return; }
    if (password.length < 6)  { showAlert('Password must be at least 6 characters.', 'error'); return; }
  }

  btn.disabled = true;
  document.getElementById('submitText').textContent = 'PROCESSING...';

  try {
    if (currentMode === 'login') {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { showAlert(error.message, 'error'); }
      else        { showAlert('Access granted! Redirecting...', 'success'); setTimeout(() => window.location.href = 'index.html', 1200); }
    } else {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) {
        showAlert(error.message, 'error');
      } else {
        showAlert('✓ Account created! Check your email to verify, then login below.', 'success');
        // Clear fields and switch to login — they must login manually
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
        document.getElementById('confirmPw').value = '';
        setTimeout(() => switchMode('login'), 2000);
      }
    }
  } catch(e) {
    showAlert('Connection error. Please try again.', 'error');
  }

  btn.disabled = false;
  document.getElementById('submitText').textContent = currentMode === 'login' ? 'INITIATE LOGIN →' : 'CREATE ACCOUNT →';
}

// ── HELPERS ──────────────────────────────────────────────
function showAlert(msg, type) {
  const el = document.getElementById('alertBox');
  el.textContent = msg;
  el.className = `alert ${type} show`;
}

function clearAlert() {
  const el = document.getElementById('alertBox');
  el.className = 'alert';
}

function togglePw() {
  const inp = document.getElementById('password');
  const btn = document.getElementById('pwToggle');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

</script>
</body>
</html>
