<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalendarAI — Study Planner · padhIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
/* ══ EMERALD ARCHITECT THEME ════════════════════
   Concept: Blueprint architect. Deep teal + white.
   Blueprint lines on dark. Technical precision.
   Palette: #010d0d bg · #00e5aa emerald · #fff lines
   ═══════════════════════════════════════════════ */
:root{
  --bg:#010d0a; --bg2:#011810; --bg3:#021f15;
  --em:#00e5aa; --em2:#00b888; --em3:#009966;
  --text:#d0fff0; --muted:#2a7a5a; --border:rgba(0,229,170,.08);
  --card:rgba(1,24,16,.88);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;overflow-x:hidden;}

/* Blueprint grid */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,170,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,170,.025) 1px,transparent 1px);
  background-size:40px 40px;}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(0,229,170,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,170,.07) 1px,transparent 1px);
  background-size:200px 200px;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 1.5rem;
  background:rgba(1,13,10,.92);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(0,229,170,.08);}
.nav-logo{font-family:'Orbitron',monospace;font-weight:700;font-size:.88rem;
  color:var(--em);text-shadow:0 0 14px rgba(0,229,170,.5);text-decoration:none;letter-spacing:3px;}
.nav-links{display:flex;gap:.25rem;background:rgba(0,229,170,.04);
  border:1px solid rgba(0,229,170,.1);border-radius:999px;padding:.22rem .3rem;}
.nav-links a{font-size:.72rem;font-weight:600;color:rgba(208,255,240,.35);text-decoration:none;
  padding:.3rem .7rem;border-radius:999px;transition:all .2s;}
.nav-links a:hover,.nav-links a.nav-active{color:#fff;background:rgba(0,229,170,.14);}
.nav-right{display:flex;justify-content:flex-end;}
#navAuth{display:flex;justify-content:flex-end;}

/* MAIN */
main{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:72px 1.5rem 3rem;}

/* HEADER */
.plan-header{padding:2rem 0 1.5rem;animation:fadeUp .8s .2s both;}
.ph-badge{display:inline-flex;align-items:center;gap:.5rem;
  background:rgba(0,229,170,.05);border:1px solid rgba(0,229,170,.15);
  color:var(--em);font-family:'JetBrains Mono',monospace;
  font-size:.58rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  padding:.35rem 1rem;border-radius:3px;margin-bottom:1.4rem;}
.ph-dot{width:5px;height:5px;border-radius:50%;background:var(--em);box-shadow:0 0 8px var(--em);animation:pulse 2s infinite;}
.ph-title{font-family:'Orbitron',monospace;font-weight:900;
  font-size:clamp(2rem,5vw,3.2rem);line-height:1.1;margin-bottom:.6rem;}
.pht-em{color:var(--em);text-shadow:0 0 24px rgba(0,229,170,.4);}
.pht-white{color:#fff;}
.ph-sub{font-family:'Syne',sans-serif;font-size:.88rem;color:var(--muted);line-height:1.7;max-width:480px;}

/* PLAN BUILDER */
.plan-builder{
  background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;
  box-shadow:0 0 60px rgba(0,229,170,.04),0 32px 60px rgba(0,0,0,.6);
  animation:fadeUp .8s .4s both;margin-bottom:1.25rem;}
.pb-header{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;
  border-bottom:1px solid var(--border);background:rgba(0,229,170,.04);}
.pbh-title{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.16em;
  color:var(--em);text-transform:uppercase;}
.pbh-status{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);}

.pb-body{padding:1.25rem;}

.pb-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.9rem;}
.pb-field label{display:block;font-family:'JetBrains Mono',monospace;font-size:.58rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:.38rem;}
.pb-field input,.pb-field select{width:100%;background:rgba(0,229,170,.04);
  border:1px solid rgba(0,229,170,.12);border-radius:8px;padding:.65rem .85rem;
  color:var(--text);font-family:'Syne',sans-serif;font-size:.84rem;outline:none;transition:all .2s;}
.pb-field input:focus,.pb-field select:focus{border-color:rgba(0,229,170,.38);}
.pb-field input::placeholder{color:var(--muted);}
.pb-field select option{background:#011810;}

.gen-btn{width:100%;padding:.85rem;border-radius:10px;
  background:linear-gradient(135deg,rgba(0,229,170,.15),rgba(0,184,136,.1));
  border:1px solid rgba(0,229,170,.28);color:var(--em);
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.8rem;letter-spacing:.12em;
  cursor:pointer;transition:all .2s;margin-top:.25rem;}
.gen-btn:hover{background:rgba(0,229,170,.2);box-shadow:0 0 20px rgba(0,229,170,.15);}
.gen-btn:disabled{opacity:.4;cursor:not-allowed;}

/* PLAN OUTPUT */
.plan-output{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;
  display:none;animation:fadeUp .5s both;box-shadow:0 32px 60px rgba(0,0,0,.6);}
.po-header{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.25rem;
  border-bottom:1px solid var(--border);background:rgba(0,229,170,.04);}
.poh-title{font-family:'JetBrains Mono',monospace;font-size:.62rem;letter-spacing:.16em;color:var(--em);}
.poh-meta{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);}
.po-body{max-height:52vh;overflow-y:auto;padding:1.25rem;
  scrollbar-width:thin;scrollbar-color:rgba(0,229,170,.12) transparent;
  font-family:'Syne',sans-serif;font-size:.84rem;line-height:1.8;color:rgba(208,255,240,.82);}
.po-body::-webkit-scrollbar{width:3px;}
.po-body::-webkit-scrollbar-thumb{background:rgba(0,229,170,.12);}
.po-body strong{color:var(--em);}
.po-body h3{font-family:'JetBrains Mono',monospace;color:var(--em);font-size:.78rem;
  letter-spacing:.12em;text-transform:uppercase;margin:1rem 0 .4rem;
  border-left:2px solid var(--em);padding-left:.6rem;}
.loading-plan{display:flex;align-items:center;gap:.75rem;padding:.5rem 0;
  color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.72rem;}
.plan-spinner{width:14px;height:14px;border:2px solid transparent;border-top-color:var(--em);
  border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media(max-width:550px){.pb-row{grid-template-columns:1fr;}}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">CalendarAI</a>
  <div class="nav-links">
    <a href="resources.html">Resources</a>
    <a href="ai-tools.html" class="nav-active">AI Tools</a>
    <a href="marketplace.html">Marketplace</a>
    <a href="about.html">About</a>
  </div>
  <div class="nav-right" id="navAuth"></div>
</nav>

<main>
  <div class="plan-header">
    <div class="ph-badge"><span class="ph-dot"></span>CalendarAI · 30-Day Study Plans</div>
    <h1 class="ph-title"><span class="pht-em">Calendar</span><span class="pht-white">AI</span></h1>
    <p class="ph-sub">Tell us your exam date and subject. Get a personalised 30-day study plan — chapter by chapter, day by day, built for your board exam.</p>
  </div>

  <div class="plan-builder">
    <div class="pb-header">
      <div class="pbh-title">// STUDY_PLAN_GENERATOR</div>
      <div class="pbh-status" id="builderStatus">READY</div>
    </div>
    <div class="pb-body">
      <div class="pb-row">
        <div class="pb-field">
          <label>Class</label>
          <select id="planClass">
            <option value="10">Class 10</option>
            <option value="12">Class 12</option>
            <option value="9">Class 9</option>
            <option value="11">Class 11</option>
          </select>
        </div>
        <div class="pb-field">
          <label>Subject</label>
          <select id="planSubject">
            <option>Physics</option><option>Chemistry</option><option>Biology</option>
            <option>Mathematics</option><option>History</option><option>Geography</option>
            <option>Economics</option><option>English</option><option>All Subjects</option>
          </select>
        </div>
      </div>
      <div class="pb-row">
        <div class="pb-field">
          <label>Exam Date</label>
          <input type="date" id="examDate">
        </div>
        <div class="pb-field">
          <label>Daily Study Hours</label>
          <select id="studyHours">
            <option value="2">2 hours/day</option>
            <option value="3" selected>3 hours/day</option>
            <option value="4">4 hours/day</option>
            <option value="5">5+ hours/day</option>
          </select>
        </div>
      </div>
      <div class="pb-row">
        <div class="pb-field">
          <label>Current Level</label>
          <select id="currentLevel">
            <option value="beginner">Beginner (Starting from scratch)</option>
            <option value="intermediate" selected>Intermediate (Know basics)</option>
            <option value="advanced">Advanced (Need revision only)</option>
          </select>
        </div>
        <div class="pb-field">
          <label>Weak Areas (optional)</label>
          <input type="text" id="weakAreas" placeholder="e.g. Trigonometry, Optics">
        </div>
      </div>
      <button class="gen-btn" onclick="generatePlan()" id="genBtn">📅 GENERATE MY STUDY PLAN</button>
    </div>
  </div>

  <div class="plan-output" id="planOutput">
    <div class="po-header">
      <div class="poh-title">// YOUR_PERSONALISED_PLAN</div>
      <div class="poh-meta" id="planMeta">Generating...</div>
    </div>
    <div class="po-body" id="planBody"></div>
  </div>
</main>

<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
if(typeof initNavAuth==='function') initNavAuth();

// Set default exam date to 30 days from now
const d=new Date(); d.setDate(d.getDate()+30);
document.getElementById('examDate').value=d.toISOString().slice(0,10);

async function generatePlan(){
  const cls=document.getElementById('planClass').value;
  const subj=document.getElementById('planSubject').value;
  const exam=document.getElementById('examDate').value;
  const hours=document.getElementById('studyHours').value;
  const level=document.getElementById('currentLevel').value;
  const weak=document.getElementById('weakAreas').value.trim();
  const btn=document.getElementById('genBtn');
  const output=document.getElementById('planOutput');
  const body=document.getElementById('planBody');
  const meta=document.getElementById('planMeta');
  btn.disabled=true; btn.textContent='⏳ BUILDING PLAN...';
  output.style.display='block';
  body.innerHTML='<div class="loading-plan"><div class="plan-spinner"></div>Crafting your personalised study plan...</div>';
  const daysLeft=Math.max(1,Math.round((new Date(exam)-new Date())/(1000*60*60*24)));
  meta.textContent=`CLASS ${cls} · ${subj.toUpperCase()} · ${daysLeft} DAYS`;
  const prompt=`Create a detailed ${daysLeft}-day study plan for an Indian Class ${cls} student preparing for their board exam.

Details:
- Subject: ${subj}
- Days until exam: ${daysLeft}
- Daily study time: ${hours} hours
- Current level: ${level}
${weak?`- Weak areas: ${weak}`:''}

Create a structured week-by-week plan with:
1. Week-wise chapter breakdown
2. Daily study targets (chapters/topics)
3. Revision schedule in the last week
4. Mock test days
5. Tips specific to CBSE Class ${cls} ${subj} board exams

Format it clearly with weeks and days. Be practical and motivating.`;
  try{
    const res=await fetch(`${location.origin}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:prompt}]}),signal:AbortSignal.timeout(30000)});
    if(!res.ok)throw new Error('error');
    const data=await res.json();
    const text=data.text||'';
    body.innerHTML=text.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^### (.*)/gm,'<h3>$1</h3>').replace(/^## (.*)/gm,'<h3>$1</h3>');
  }catch(e){
    body.innerHTML='<p>Could not generate plan. Please check your connection and try again.</p>';
  }
  btn.disabled=false; btn.textContent='📅 GENERATE MY STUDY PLAN';
}
</script>
</body>
</html>
